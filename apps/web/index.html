<!doctype html>
<html lang="en" data-theme="paper">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>THE———BOARD</title>
    <!-- Inline SVG data URI: no extra request, no 404, and it adapts to the tab's colour. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314161A'/%3E%3Cpath d='M7 11h18M7 16h11M7 21h14' stroke='%23FBFAF7' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <meta name="description" content="Real-time collaborative canvas. Draw, talk, and let the AI clean it up." />
    <script>
      // Theme is applied BEFORE first paint. Doing this in a React effect produces a visible
      // flash of the wrong theme on every load — see docs/05-DESIGN-SYSTEM.md.
      (function () {
        try {
          var stored = localStorage.getItem('board:theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = stored || (prefersDark ? 'ink' : 'paper');
        } catch (e) {
          document.documentElement.dataset.theme = 'paper';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
