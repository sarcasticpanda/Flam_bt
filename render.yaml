services:
  - type: web
    name: the-board-server
    env: node
    buildCommand: pnpm install && pnpm build
    startCommand: cd apps/server && pnpm start
    envVars:
      - key: CLIENT_ORIGIN
        value: "*" # Set this to your Vercel URL in Render dashboard later for security
      - key: PORT
        value: 3001
